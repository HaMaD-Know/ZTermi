# Checks Terminia itself on every push and pull request (Linux, no Xcode):
# lint, types, unit and integration tests (including the remote agent against
# the runner's real PowerShell 7), web build, CI template copies, and the
# static iOS project checks. The iOS app itself is built by terminia-ios.yml,
# the same template Terminia installs into user projects.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: PowerShell available for the agent tests
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: CI template copies are current
        run: npm run check:templates

      - name: Static iOS project checks
        run: npm run check:ios

      - name: Build web assets
        run: npm run build
