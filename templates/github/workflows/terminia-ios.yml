# terminia-template: ios-workflow v1
# Builds an iOS app (Capacitor or native Xcode project) on a GitHub-hosted
# macOS runner and uploads the .ipa. Terminia starts it through the GitHub API
# (workflow_dispatch) and follows it from the iPad; it can also be run from
# the Actions tab.
#
# export_method=unsigned needs no secrets but produces an IPA that must be
# signed before it can be installed. Signed exports need these secrets:
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64
name: Terminia iOS
run-name: "Terminia iOS ${{ inputs.configuration }} (${{ inputs.export_method }}) · ${{ inputs.terminia_build_id }}"

on:
  workflow_dispatch:
    inputs:
      terminia_build_id:
        description: Build id from Terminia (used to match this run)
        type: string
        default: manual
      project_path:
        description: Project folder inside the repository
        type: string
        default: '.'
      configuration:
        description: Build configuration
        type: choice
        options: [release, debug]
        default: release
      export_method:
        description: unsigned, or a signed export (needs signing secrets)
        type: choice
        options: [unsigned, development, ad-hoc, app-store, enterprise]
        default: unsigned
      scheme:
        description: Xcode scheme (empty = App, or the first shared scheme)
        type: string
        default: ''
      xcode_version:
        description: Xcode version on the runner
        type: string
        default: '26.5'
      generate_native:
        description: Run `npx cap add ios` when a Capacitor project has no ios/ folder
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: terminia-ios-${{ github.ref }}-${{ inputs.terminia_build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PROJECT_PATH: ${{ inputs.project_path }}
      CONFIGURATION: ${{ inputs.configuration }}
      EXPORT_METHOD: ${{ inputs.export_method }}
      SCHEME: ${{ inputs.scheme }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      GENERATE_NATIVE: ${{ inputs.generate_native }}
      TERMINIA_BUILD_ID: ${{ inputs.terminia_build_id }}
      TERMINIA_OUT: ${{ github.workspace }}/terminia-out
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: bash .terminia/ci/detect-project.sh ios

      - name: Select Xcode
        run: bash .terminia/ci/select-xcode.sh

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.has_package_json == 'true'
        with:
          node-version: ${{ steps.detect.outputs.node_version }}

      - name: Install dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        run: bash .terminia/ci/install-deps.sh

      - name: Check signing configuration
        id: signing
        env:
          HAS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          if [ "$EXPORT_METHOD" = unsigned ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Terminia::Unsigned build: the IPA must be signed before it can be installed on a device."
          elif [ "$HAS_P12" = true ] && [ "$HAS_PASSWORD" = true ] && [ "$HAS_PROFILE" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Waiting for signing configuration::export_method '$EXPORT_METHOD' needs the secrets IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64. Add them in Settings > Secrets and variables > Actions, or build with export_method=unsigned."
            exit 1
          fi

      - name: Import signing certificate and profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .terminia/ci/ios-import-signing.sh

      - name: Build and package IPA
        id: build
        run: bash .terminia/ci/ios-build.sh

      - name: Remove temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$TERMINIA_KEYCHAIN" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.ipa_name }}
          path: terminia-out/${{ steps.build.outputs.ipa_name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminia-ios-logs-${{ github.run_attempt }}
          path: terminia-out/logs/
          if-no-files-found: ignore
          retention-days: 14
